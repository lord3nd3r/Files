# Fork-only Windows build. This file stays on the fork's main branch.
# It checks out the requested ref and builds Files.App Release x64.
# Signing, packaging, symbol upload, and UI tests are intentionally omitted.

name: Fork Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'fix/unobserved-task-crash'
        type: string
  push:
    branches:
      - 'fix/**'

run-name: Windows build ${{ github.event.inputs.ref || github.ref_name }}

env:
  SOLUTION_PATH: '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files.App\Files.App.csproj'
  CONFIGURATION: 'Release'
  ARCHITECTURE: 'x64'

jobs:

  build:

    runs-on: windows-2025

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.ref || github.sha }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore Files
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore `
          -p:Platform=$env:ARCHITECTURE `
          -p:Configuration=$env:CONFIGURATION `
          -p:PublishReadyToRun=true `
          -v:quiet

    - name: Build Files
      shell: pwsh
      run: |
        msbuild `
          -warnaserror `
          -warnnotaserror:CS0612,CS0618,CS0672,IL2104 `
          $env:APP_PROJECT_PATH `
          -t:Build `
          -p:Configuration=$env:CONFIGURATION `
          -p:Platform=$env:ARCHITECTURE `
          -p:AppxBundle=Never `
          -p:GenerateAppxPackageOnBuild=false `
          -v:quiet
